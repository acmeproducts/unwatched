# DigitalOcean App Platform. One app, two services from images in the DigitalOcean container registry:
# the town (one long-lived process with WebSockets, reached under /town) and the web at /.
# deploy/do.sh builds, pushes, and applies this spec. Secrets are set once with `doctl apps update` and never committed.
name: ferry-town
region: fra
services:
  - name: town
    image:
      registry_type: DOCR
      repository: ferry-town-town
      tag: latest
    http_port: 4000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
    routes:
      - path: /town
        preserve_path_prefix: false
    envs:
      - key: PORT
        value: "4000"
      - key: FT_BRAIN
        value: openrouter
      - key: FT_MS_PER_SIM_MINUTE
        value: "60000"
      - key: FT_SEED
        value: "42"
      - key: FT_CITIZENS
        value: "20"
      - key: FT_FERRY_SPACES
        value: "8"
  - name: web
    image:
      registry_type: DOCR
      repository: ferry-town-web
      tag: latest
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
