# DigitalOcean App Platform. One app, two services from images in the DigitalOcean container registry:
# the town (one long-lived process with WebSockets, reached under /town) and the web at /.
# deploy/do.sh builds, pushes, and applies this spec. Secrets are set once with `doctl apps update` and never committed.
name: unwatched
region: fra
# The island's own address. DNS points here with a CNAME to the app's default hostname; the certificate is DigitalOcean's.
domains:
  - domain: unwatched.world
    type: PRIMARY
  - domain: www.unwatched.world
    type: ALIAS
services:
  - name: town
    image:
      registry_type: DOCR
      repository: unwatched-town
      tag: latest
    http_port: 4000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
    routes:
      - path: /engine
        preserve_path_prefix: false
    envs:
      - key: PORT
        value: "4000"
      - key: UW_BRAIN
        value: openrouter
      - key: UW_MS_PER_SIM_MINUTE
        value: "60000"
      - key: UW_SEED
        value: "42"
      - key: UW_CITIZENS
        value: "20"
      - key: UW_BOAT_SPACES
        value: "8"
      - key: UW_REAL_WORLD
        value: 43.17,16.44,Europe/Zagreb
      - key: UW_TOWN_NAME
        value: The island
  - name: web
    image:
      registry_type: DOCR
      repository: unwatched-web
      tag: latest
    http_port: 3000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
